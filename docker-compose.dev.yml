services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: eight-canteen-backend-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - /app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=development
